<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TempoSkip Controller</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-badge">⏩</div>
        <div>
          <h1>TempoSkip</h1>
          <p class="subtitle" id="playerStatus">Scanning active tab...</p>
        </div>
      </div>
      <label class="switch" title="Enable or disable TempoSkip globally">
        <input type="checkbox" id="enabledToggle" checked />
        <span class="slider"></span>
      </label>
    </header>

    <!-- Site Toggle Pill -->
    <div class="site-bar" id="siteBar">
      <span class="site-host" id="currentHost">All websites</span>
      <button type="button" class="pill-btn" id="toggleSiteBtn">Enabled on site</button>
    </div>

    <!-- Playback Speed Section -->
    <section class="card">
      <div class="card-header">
        <span class="card-title">Playback Speed</span>
        <div class="speed-input-wrap">
          <input
            type="number"
            id="speedNumber"
            min="0.07"
            max="16"
            step="0.05"
            value="1.00"
            aria-label="Custom playback speed"
          />
          <span class="unit">×</span>
        </div>
      </div>

      <input
        type="range"
        id="speedRange"
        class="range-slider"
        min="0.25"
        max="4.0"
        step="0.05"
        value="1.0"
      />

      <div class="preset-grid" id="speedPresets">
        <button type="button" data-speed="0.5">0.5×</button>
        <button type="button" data-speed="0.75">0.75×</button>
        <button type="button" data-speed="1">1.0×</button>
        <button type="button" data-speed="1.25">1.25×</button>
        <button type="button" data-speed="1.5">1.5×</button>
        <button type="button" data-speed="1.75">1.75×</button>
        <button type="button" data-speed="2">2.0×</button>
        <button type="button" data-speed="2.5">2.5×</button>
        <button type="button" data-speed="3">3.0×</button>
        <button type="button" data-speed="4">4.0×</button>
      </div>

      <label class="check-row">
        <input type="checkbox" id="forceSpeedToggle" checked />
        <span>Lock speed (override players that try to reset speed)</span>
      </label>
    </section>

    <!-- Arrow Key Skip Duration Section -->
    <section class="card">
      <div class="card-header">
        <span class="card-title">Left / Right Arrow Key Skip</span>
        <label class="mini-switch" title="Override player Left & Right arrow keys">
          <input type="checkbox" id="overrideArrowsToggle" checked />
          <span class="mini-slider"></span>
        </label>
      </div>

      <div class="skip-grid">
        <div class="skip-box">
          <label for="rewindInput">⬅ Left Arrow (Rewind)</label>
          <div class="input-with-btn">
            <input type="number" id="rewindInput" min="0.1" max="3600" step="0.5" value="5" />
            <span class="sec-label">sec</span>
            <button type="button" class="test-skip-btn" id="testRewindBtn" title="Skip backward now">⏪</button>
          </div>
        </div>

        <div class="skip-box">
          <label for="forwardInput">➡ Right Arrow (Forward)</label>
          <div class="input-with-btn">
            <input type="number" id="forwardInput" min="0.1" max="3600" step="0.5" value="5" />
            <span class="sec-label">sec</span>
            <button type="button" class="test-skip-btn" id="testForwardBtn" title="Skip forward now">⏩</button>
          </div>
        </div>
      </div>

      <div class="skip-presets-label">Quick Skip Presets (sets both Left &amp; Right)</div>
      <div class="preset-grid skip-preset-grid" id="skipPresets">
        <button type="button" data-skip="1">1s</button>
        <button type="button" data-skip="2">2s</button>
        <button type="button" data-skip="3">3s</button>
        <button type="button" data-skip="5">5s</button>
        <button type="button" data-skip="7">7s</button>
        <button type="button" data-skip="10">10s</button>
        <button type="button" data-skip="15">15s</button>
        <button type="button" data-skip="30">30s</button>
      </div>

      <div class="divider"></div>

      <label class="check-row">
        <input type="checkbox" id="shiftMultiplierToggle" checked />
        <span>Enable <strong>Shift + Arrow</strong> secondary jump</span>
      </label>

      <div class="skip-grid compact-grid" id="shiftSkipRow">
        <div class="skip-box">
          <label for="shiftRewindInput">⇧ + ⬅ Rewind</label>
          <div class="input-with-btn">
            <input type="number" id="shiftRewindInput" min="0.1" max="3600" step="1" value="15" />
            <span class="sec-label">sec</span>
          </div>
        </div>
        <div class="skip-box">
          <label for="shiftForwardInput">⇧ + ➡ Forward</label>
          <div class="input-with-btn">
            <input type="number" id="shiftForwardInput" min="0.1" max="3600" step="1" value="15" />
            <span class="sec-label">sec</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Stream & Buffer Stability + Extra Controls -->
    <section class="card compact-card">
      <label class="check-row" title="Batches rapid skips into one seek and helps streaming players recover from out-of-buffer seeks">
        <input type="checkbox" id="safeMseSeekToggle" checked />
        <span>Smart seeking on streaming sites (batch rapid skips, recover stalls)</span>
      </label>
      <label class="check-row">
        <input type="checkbox" id="speedHotkeysToggle" checked />
        <span>Speed hotkeys: <kbd>[</kbd> slower, <kbd>]</kbd> faster, <kbd>\</kbd> 1.0×</span>
      </label>
      <label class="check-row">
        <input type="checkbox" id="showHudToggle" checked />
        <span>Show on-video HUD indicator on speed/skip</span>
      </label>
    </section>

    <!-- Learned per-site seek profiles -->
    <section class="card compact-card" id="learnedCard">
      <div class="learned-head">
        <span class="card-title">Learned sites</span>
        <button type="button" class="link-btn" id="forgetAllBtn">Forget all</button>
      </div>
      <div id="learnedList" class="learned-list"></div>
    </section>

    <footer class="footer">
      <button type="button" class="reset-btn" id="resetDefaultsBtn">Reset All to Defaults</button>
      <button type="button" class="reset-btn" id="copyDiagBtn" title="Copies player diagnostics from the current tab to your clipboard">Copy diagnostics</button>
      <div id="diagStatus" class="diag-status" aria-live="polite"></div>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
